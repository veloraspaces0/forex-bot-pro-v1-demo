# STAGING-ONLY experimental fallback. No real GitHub dispatch unless separately
# provisioned with a secret AND BACKUP_SCHEDULER_MODE set to "active".
name = "forex-v21-schedule-backup-staging"
main = "forex_schedule_backup_entry.mjs"
compatibility_date = "2026-11-04"
workers_dev = false

[vars]
BACKUP_SCHEDULER_MODE = "observe"

[triggers]
crons = ["10,25,40,55 * * * *"]

[[durable_objects.bindings]]
name = "BACKUP_DISPATCH_GUARD"
class_name = "BackupDispatchGuard"

[[migrations]]
tag = "backup-dispatch-sqlite-v1"
new_sqlite_classes = ["BackupDispatchGuard"]
