name: Forex PAPER schedule-backup (offline only)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/forex-v21-cloudflare-scheduler-backup-staging
    paths:
      - 'experimentos/forex_schedule_backup_worker.mjs'
      - 'experimentos/wrangler_backup.toml'
      - 'tests/test_forex_schedule_backup_worker.mjs'
      - '.github/workflows/forex-scheduler-backup-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety and failure injection tests (offline only)
        run: node --test tests/test_forex_schedule_backup_worker.mjs
      - name: Bundling validation without deployment
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config experimentos/wrangler_backup.toml
      - name: Static guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('experimentos/forex_schedule_backup_worker.mjs').read_text()
          config=Path('experimentos/wrangler_backup.toml').read_text()
          assert 'state.enc' not in s.replace('// state.enc',''), 'No encrypted state access allowed'
          assert 'FOREX_BOT_LIVE' not in s and 'brokerage.example.com' not in s
          assert 'workflow_dispatch' in s
          assert 'BACKUP_SCHEDULER_MODE = "observe"' in config
          assert 'forex-v2.yml' in s and 'main' in s
          print('Safe opt-in static checks passed; NO deployment and NO workflow dispatch performed.')
          PY
