name: Forex Watch V2.3 — tests offline (no trades)
on:
  workflow_dispatch:
  push:
    branches:
      - experimento-forex-watch-v23-20261104
      - hardening-forex-watch-v23-20261104
      - deploy-ready-forex-watch-v23-20261104
      - revisao-final-forex-watch-v23-20261104
      - auditoria-adversarial-watch-v23-20261104
      - fix/forex-watch-v231-github-diagnostics-20261104
      - fix/forex-watch-v232-github-403-diagnostics
      - fix/forex-watch-v233-resilience
    paths:
      - 'experimentos/forex_watch_v23.py'
      - 'experimentos/forex_watch_v23_worker.mjs'
      - 'experimentos/wrangler_v23.toml'
      - 'experimentos/setup_watch_v23.ps1'
      - 'experimentos/DEPLOY_WATCH_V23.md'
      - 'tests/test_forex_watch_v23.py'
      - 'tests/test_forex_watch_v23_worker.mjs'
      - '.github/workflows/forex-watch-v23.yml'
permissions:
  contents: read
# Cancel outdated EXPERIMENTAL runs only; never share the V2.1 paper bot's lock.
concurrency:
  group: forex-watch-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python V2.3 adversarial offline tests
        run: python -m unittest discover -s tests -p 'test_forex_watch_v23.py' -v
      - name: Cloudflare Worker V2.3 offline tests
        run: node --test tests/test_forex_watch_v23_worker.mjs
      - name: Cloudflare Wrangler v4 bundle validation (DRY RUN — no deploy)
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config experimentos/wrangler_v23.toml
      - name: Validate Windows PowerShell deployment helper syntax (never execute)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("experimentos/setup_watch_v23.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-Host; exit 1 }
          Write-Host "PowerShell deployment helper syntax OK (no execution, no deployment)."
      - name: Static verify only — NEVER run paper trading or read secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('experimentos/forex_watch_v23_worker.mjs').read_text()
          assert "state.enc" not in text, "Worker must not read encrypted operational state"
          assert "github.com" in text and "api.github.com" in text, "Public GitHub source required"
          assert "git push" not in text and "workflow_dispatch" not in text, "No GitHub write/trigger actions"
          print("Experimental CI: Worker static checks OK; no scheduled deployment.")
          PY

  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real PowerShell user preflight (NO login, NO deploy)
        shell: powershell
        run: .\\experimentos\\setup_watch_v23.ps1 -PreflightOnly

  telegram-results:
    name: Telegram — V2.3.3 CI result
    if: ${{ always() && github.ref == 'refs/heads/fix/forex-watch-v233-resilience' }}
    needs: [verify, windows-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send final result to Telegram (no secrets in logs)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINUX_RESULT: ${{ needs.verify.result }}
          WINDOWS_RESULT: ${{ needs.windows-preflight.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat=os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat:
              print("Telegram notification not configured: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as repository Actions secrets.")
              raise SystemExit(1)
          linux=os.environ["LINUX_RESULT"]
          windows=os.environ["WINDOWS_RESULT"]
          passed=linux=="success" and windows=="success"
          label="APROVADO" if passed else "REPROVADO / INCOMPLETO"
          msg=(f"Forex Watch V2.3.3 — testes {label}\\n"
               f"Linux: {linux}\\nWindows: {windows}\\n"
               f"GitHub: {os.environ['RUN_URL']}\\n"
               "Somente testes offline; sem deploy e sem trades.")
          data=json.dumps({"chat_id":chat,"text":msg}).encode()
          # Avoid printing the URL (contains token) in exception output.
          try:
              request=urllib.request.Request(
                  "https://api.telegram.org/bot"+token+"/sendMessage",
                  data=data,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=12) as response:
                  ok=json.load(response).get("ok",False)
              if not ok: raise RuntimeError("Telegram rejected message")
          except Exception:
              print("Telegram delivery failed. Check bot token, chat ID and /start.")
              raise SystemExit(1)
          print("Telegram result delivered successfully.")
          PY
