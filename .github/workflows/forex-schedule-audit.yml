name: Forex schedule audit (offline only)
on:
  pull_request:
    paths:
      - 'v2/schedule_health.py'
      - 'tests/test_schedule_health.py'
      - '.github/workflows/forex-schedule-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_schedule_health.py' -v
