name: Forex V2.2 risk experiment (offline)
on:
  pull_request:
    paths:
      - 'experimentos/forex_v22_risk_experiment.py'
      - 'tests/test_forex_v22_risk_experiment.py'
      - '.github/workflows/forex-v22-risk-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_forex_v22_risk_experiment.py' -v
