name: Forex Bot Pro V2 - Paper EURUSD

on:
  workflow_dispatch:
  schedule:
    # 7 minutes after a 15-minute boundary, best-effort scheduler (UTC).
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - 'v2/paper_bot.py'
      - 'v2/runner.py'
      - 'v2/recover_gap.py'
      - 'tests/test_paper_bot.py'
      - 'tests/test_v21_hardening.py'
      - 'tests/test_v21_consolidation.py'
      - '.github/workflows/forex-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency for encrypted-state tests
        run: python -m pip install 'cryptography>=43,<49'
      - name: Paper engine and hardening tests (offline)
        run: python -m unittest discover -s tests -v

  paper:
    # Feature branches are TEST-ONLY: never call the live provider and never
    # mutate encrypted history or dashboard data from an audit/PR branch.
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: forex-bot-pro-v2-main-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=43,<49'
      - name: Encrypted PAPER runner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          V2_STATE_ENCRYPTION_KEY: ${{ secrets.V2_STATE_ENCRYPTION_KEY }}
        run: python v2/runner.py
      - name: Validate public dashboard schema and forbid private OHLC data
        run: |
          python - <<'PY'
          import json
          data=json.load(open('v2/state.json',encoding='utf-8'))
          forbidden={'candles','last_quote','position','trades','apikey','entry','exit'}
          assert not (forbidden & data.keys()), 'Sensitive fields in public dashboard'
          assert data['mode']=='PAPER_ONLY' and data['pair']=='EUR/USD'
          assert isinstance(data.get('closed_trades'),int)
          print('Public dashboard validation succeeded')
          PY
      - name: Publish sanitized successful-run heartbeat
        env:
          FOREX_RUN_ID: ${{ github.run_id }}
          FOREX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'v2')
          from datetime import datetime, timezone
          from pathlib import Path
          from runner import atomic_write
          state=json.loads(Path('v2/state.json').read_text(encoding='utf-8'))
          assert state['mode']=='PAPER_ONLY'
          assert state['pair']=='EUR/USD'
          assert isinstance(state.get('last_checked_at'),str)
          heartbeat={
              'schema_version':1,
              'mode':'PAPER_ONLY',
              'run_id':os.environ['FOREX_RUN_ID'],
              'run_attempt':int(os.environ['FOREX_RUN_ATTEMPT']),
              'completed_at':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'),
              'state_last_checked_at':state['last_checked_at'],
              'status':'SUCCESS',
          }
          atomic_write(Path('v2/heartbeat.json'),(json.dumps(heartbeat,indent=2)+'\n').encode('utf-8'))
          PY
      - name: Commit derived dashboard, encrypted state and heartbeat
        run: |
          git add -- v2/state.enc v2/state.json v2/heartbeat.json
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(v2): update encrypted paper state [skip ci]'
          # Fail closed on a concurrent update: never force, never automatically
          # rebase and overwrite newer encrypted state.
          git push
