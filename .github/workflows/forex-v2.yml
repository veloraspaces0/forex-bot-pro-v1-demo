name: Forex Bot Pro V2 - Paper EURUSD

on:
  push:
    paths:
      - 'v2/*.py'
      - 'v2/tests/**'
      - '.github/workflows/forex-v2.yml'
  workflow_dispatch:
  schedule:
    # 7 minutos apos o fechamento de cada candle de 15 minutos (UTC).
    # GitHub Actions pode atrasar; nao e execucao de baixa latencia.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: forex-bot-pro-v2-state
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes de seguranca e regressao
        run: python -m unittest discover -s v2/tests -v

      - name: Atualizar paper trading EUR/USD
        id: bot
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python v2/run.py

      - name: Publicar estado no repositorio
        if: always() && steps.bot.outcome != 'skipped'
        run: |
          if git diff --quiet -- v2/state.json; then
            echo "Estado sem alteracoes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/state.json
          git commit -m "data(v2): atualizar paper trading EUR/USD [skip ci]"
          git push

      - name: Sinalizar erro da API no workflow
        if: steps.bot.outcome == 'failure'
        run: exit 1
