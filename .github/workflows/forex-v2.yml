name: Forex Bot Pro V2 - Paper EURUSD

on:
  workflow_dispatch:
  schedule:
    # 7 minutes after a 15-minute boundary (UTC); GitHub may delay/drop runs.
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - 'v2/paper_bot.py'
      - 'v2/runner.py'
      - 'tests/test_paper_bot.py'
      - '.github/workflows/forex-v2.yml'

permissions:
  contents: write

concurrency:
  group: forex-bot-pro-v2-state
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Encryption dependency
        run: python -m pip install 'cryptography>=43,<49'

      - name: Paper-trading engine tests
        run: python -m unittest discover -s tests -v

      - name: Encrypted paper runner (no key = no operation)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          V2_STATE_ENCRYPTION_KEY: ${{ secrets.V2_STATE_ENCRYPTION_KEY }}
        run: python v2/runner.py

      - name: Ensure public JSON excludes raw market data
        run: |
          python - <<'PY'
          import json
          data=json.load(open('v2/state.json',encoding='utf-8'))
          forbidden={'candles','last_quote','position','trades','apikey'}
          assert not (forbidden & data.keys()), 'Public market data leak'
          assert data['mode']=='PAPER_ONLY'
          print('Public summary verified.')
          PY

      - name: Commit derived dashboard state and encrypted private state
        run: |
          git add -A -- v2/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(v2): update encrypted paper state [skip ci]"
          git push
